name: Translate

# Translates what is missing or stale into every language Kunobi speaks, with
# Claude, and opens (or updates) one pull request for a person to review. Runs
# after each merge to main, or by hand from Actions, optionally for some
# languages only. Needs the ANTHROPIC_API_KEY secret.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages, comma separated (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGUAGES: ${{ inputs.languages }}
        run: node scripts/i18n-translate.mjs ${LANGUAGES:+--lang "$LANGUAGES"} | tee translate.log
      - name: Check the result
        run: node scripts/i18n-check.mjs --markdown i18n-report.md
      - name: Describe the pull request
        run: |
          {
            echo 'Translations made by `scripts/i18n-translate.mjs` (Claude) for what was missing or stale. Please read them in the pages before merging; edit any locale file directly.'
            echo
            echo '<details><summary>Translate log</summary>'
            echo
            echo '```'
            cat translate.log
            echo '```'
            echo
            echo '</details>'
            echo
            cat i18n-report.md
          } > pr-body.md
          rm translate.log i18n-report.md
      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: i18n/translations
          delete-branch: true
          commit-message: "i18n: translate missing and stale texts"
          title: "i18n: translations to review"
          body-path: pr-body.md
          add-paths: |
            **/locales/*.json
            **/locales/index.ts
