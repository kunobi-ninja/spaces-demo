name: Translations

# Reports which translations are missing or stale on every pull request, as the
# job summary and one comment kept up to date. Missing translations never fail
# it (pages show their own language, and the Translate workflow fills them in
# after merge); a broken locale file or a key that points at nothing does.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/i18n-check.mjs --markdown i18n-report.md
      # Forks get a read-only token, so their pull requests keep only the job summary.
      - name: Comment the report
        if: always() && hashFiles('i18n-report.md') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- i18n-check -->'
            const body = `${marker}\n${fs.readFileSync('i18n-report.md', 'utf8')}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((comment) => comment.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
